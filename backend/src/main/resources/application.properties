spring.application.name=rural-mart-backend

server.port=${SERVER_PORT:8080}

# Same Supabase Postgres database the frontend uses - shared DB, separate backend.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Tables are owned/managed by Supabase migrations, never by this backend.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# JWT verification for Supabase-issued access tokens - see SupabaseJwtProperties.
# Prefer jwks-uri (asymmetric signing keys) if enabled on your project; otherwise
# leave it blank and set the legacy shared secret instead.
supabase.jwt.jwks-uri=${SUPABASE_JWT_JWKS_URI:}
supabase.jwt.secret=${SUPABASE_JWT_SECRET:}

# Used by RegistrationApprovalService to call the Supabase Auth Admin REST API
# (create/delete users) when approving a pending registration.
supabase.url=${SUPABASE_URL:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}

# Comma-separated list of origins allowed to call this API.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Surface exception messages (e.g. "Registration not found", "Only admins can
# approve registrations") in JSON error bodies - safe for this internal admin
# API; off by default in Spring Boot to avoid leaking details publicly.
spring.web.error.include-message=always

# Verbose auth logging for debugging the registration-approval flow: shows
# JWT validation failures (bad signature, expired, wrong issuer) plus this
# app's own admin-role-check logs in the mvn spring-boot:run terminal.
logging.level.com.ruralmart.backend=DEBUG
logging.level.org.springframework.security.oauth2.server.resource=DEBUG

